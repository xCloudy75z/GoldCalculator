<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f1e7">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="حاسبة الذهب">
    <meta name="description" content="حاسبة بسيطة لتقدير سعر شراء الذهب في الإمارات">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css">
    <title>حاسبة الذهب</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
        </div>
        <div>
          <p class="eyebrow">تقدير سريع وواضح</p>
          <h1>حاسبة الذهب</h1>
          <p class="intro">أدخل تفاصيل القطعة لمعرفة السعر التقريبي شامل الضريبة.</p>
        </div>
      </header>

      <section class="card input-card" aria-labelledby="inputs-title">
        <div class="section-heading">
          <h2 id="inputs-title">بيانات القطعة</h2>
          <button id="reset" class="reset-button" type="button">إعادة تعيين</button>
        </div>

        <div class="field-grid">
          <label class="field" for="gold-price">
            <span>سعر الذهب للجرام</span>
            <span class="input-wrap">
              <input id="gold-price" name="gold-price" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-describedby="gold-price-hint">
              <span class="unit">د.إ</span>
            </span>
            <small id="gold-price-hint">استخدم سعر الجرام للعيار المحدد</small>
          </label>

          <label class="field" for="making-charge">
            <span>سعر المصنعية للجرام</span>
            <span class="input-wrap">
              <input id="making-charge" name="making-charge" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
              <span class="unit">د.إ</span>
            </span>
          </label>

          <fieldset class="field purity-field">
            <legend>عيار الذهب</legend>
            <div class="segmented-control" aria-label="اختيار عيار الذهب">
              <button type="button" data-purity="18" aria-pressed="false">عيار 18</button>
              <button type="button" data-purity="21" aria-pressed="true">عيار 21</button>
              <button type="button" data-purity="22" aria-pressed="false">عيار 22</button>
              <button type="button" data-purity="24" aria-pressed="false">عيار 24</button>
            </div>
          </fieldset>

          <label class="field" for="weight">
            <span>وزن الذهب</span>
            <span class="input-wrap">
              <input id="weight" name="weight" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
              <span class="unit">جرام</span>
            </span>
          </label>
        </div>
      </section>

      <section class="card results-card" aria-labelledby="results-title">
        <h2 id="results-title">تفاصيل السعر</h2>
        <div class="breakdown" aria-live="polite" aria-atomic="true">
          <div class="result-row">
            <span>سعر الذهب</span>
            <strong id="gold-cost">—</strong>
          </div>
          <div class="result-row">
            <span>إجمالي المصنعية</span>
            <strong id="making-total">—</strong>
          </div>
          <div class="result-row">
            <span>ضريبة القيمة المضافة 5%</span>
            <strong id="vat">—</strong>
          </div>
        </div>

        <div class="subtotal-block">
          <span>الإجمالي بدون الضريبة</span>
          <strong id="subtotal">—</strong>
        </div>

        <div class="total-block">
          <span>الإجمالي شامل الضريبة</span>
          <strong id="total">—</strong>
        </div>
      </section>

      <p class="disclaimer">القيمة تقديرية وقد يختلف السعر النهائي لدى البائع.</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
